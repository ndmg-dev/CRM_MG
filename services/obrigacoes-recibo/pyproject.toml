[project]
name = "obrigacoes-recibo"
version = "0.1.0"
description = "Baixa automática de obrigações acessórias por recibo do Domínio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "watchdog>=6.0",
    # Parser seguro de XML: recibo é arquivo de terceiro e o parser padrão do
    # Python é vulnerável a XXE.
    "defusedxml>=0.7",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
