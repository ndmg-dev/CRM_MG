server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de segurança do navegador (achado na varredura de segurança —
    # não existia nenhum). O CRM nunca é embutido em iframe de outro site
    # (é ele que embute sistemas de terceiros via SystemViewer, não o
    # contrário), então DENY é seguro e não quebra nada.
    #
    # OBS: `add_header` do nginx não herda de um nível pai pra um `location`
    # que já define seu próprio `add_header` — por isso os 4 headers abaixo
    # são repetidos dentro de cada location que tem Cache-Control, em vez de
    # só uma vez aqui no server{}, senão silenciosamente sumiam de /assets/
    # e / (fica valendo só no /healthz, que não define add_header próprio).

    # Healthcheck do container: o Docker/Coolify usa isto para só derrubar a
    # versão antiga do frontend depois que a nova está de pé e respondendo
    # (deploy sem janela de 502 para quem estiver navegando no momento).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome (gerados pelo Vite) são content-addressed:
    # o conteúdo muda => o nome muda. Logo é seguro cachear "para sempre".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
        try_files $uri =404;
    }

    # Todo o resto — em especial o index.html (servido direto ou via fallback
    # do SPA) — NUNCA é cacheado, para que cada deploy seja pego imediatamente
    # e ninguém fique preso a um bundle antigo. Corrige o caso em que o
    # navegador guardava um index.html velho apontando para JS obsoleto.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    }
}
