server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck do container: o Docker/Coolify usa isto para só derrubar a
    # versão antiga do frontend depois que a nova está de pé e respondendo
    # (deploy sem janela de 502 para quem estiver navegando no momento).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome (gerados pelo Vite) são content-addressed:
    # o conteúdo muda => o nome muda. Logo é seguro cachear "para sempre".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Todo o resto — em especial o index.html (servido direto ou via fallback
    # do SPA) — NUNCA é cacheado, para que cada deploy seja pego imediatamente
    # e ninguém fique preso a um bundle antigo. Corrige o caso em que o
    # navegador guardava um index.html velho apontando para JS obsoleto.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
