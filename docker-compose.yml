version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-mg-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_mendonca_galvao}
      POSTGRES_USER: ${POSTGRES_USER:-crm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password_2024}
    ports:
      - "${HOST_POSTGRES_PORT:-5439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_admin} -d ${POSTGRES_DB:-crm_mendonca_galvao}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm-mg-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mendoncagalvao.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${HOST_PGADMIN_PORT:-5059}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: crm-mg-backend
    environment:
      # FastAPI reads POSTGRES_ variables, and JWT/GOOGLE via .env
      POSTGRES_DB: ${POSTGRES_DB:-crm_mendonca_galvao}
      POSTGRES_USER: ${POSTGRES_USER:-crm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password_2024}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: postgres
      BACKEND_CORS_ORIGINS: '["${SERVICE_URL_FRONTEND:-http://localhost:3000}"]'
      FRONTEND_URL: '${SERVICE_URL_FRONTEND:-http://localhost:3000}'
    env_file:
      - .env
    ports:
      - "${HOST_BACKEND_PORT:-8089}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - crm_storage:/app/storage
    restart: unless-stopped

  # --- Monitoramento da VPS (aba TI) — coletores read-only ------------------
  # Só o backend do CRM fala com eles (rede interna do compose, sem `ports:`).
  # docker-socket-proxy expõe a API do Docker em modo LEITURA — nenhum
  # processo do CRM toca o /var/run/docker.sock diretamente (ver
  # docs/monitoramento-vps: uma RCE no backend não pode virar takeover do host).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: crm-mg-docker-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VOLUMES: 1
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      SYSTEM: 1
      POST: 0        # bloqueia toda escrita (create/start/stop/exec/…)
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: crm-mg-cadvisor
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      - --disable_metrics=percpu,referenced_memory,cpu_topology,resctrl,udp,tcp,advtcp,sched,hugetlb,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: crm-mg-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)
      - --no-collector.wifi
      - --no-collector.hwmon
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${SERVICE_URL_BACKEND:-http://localhost:8080}/api/v1
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
        - VITE_SUPORTE_SUPABASE_URL=${VITE_SUPORTE_SUPABASE_URL:-}
        - VITE_SUPORTE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPORTE_SUPABASE_PUBLISHABLE_KEY:-}
        - VITE_FERIAS_SUPABASE_URL=${VITE_FERIAS_SUPABASE_URL:-}
        - VITE_FERIAS_SUPABASE_ANON_KEY=${VITE_FERIAS_SUPABASE_ANON_KEY:-}
        - VITE_CRONOS_API_URL=${VITE_CRONOS_API_URL:-}
        - VITE_COPILOT_SUPABASE_URL=${VITE_COPILOT_SUPABASE_URL:-}
        - VITE_COPILOT_SUPABASE_ANON_KEY=${VITE_COPILOT_SUPABASE_ANON_KEY:-}
        - VITE_COPILOT_API_URL=${VITE_COPILOT_API_URL:-}
        - VITE_BIMG_SUPABASE_URL=${VITE_BIMG_SUPABASE_URL:-}
        - VITE_BIMG_SUPABASE_ANON_KEY=${VITE_BIMG_SUPABASE_ANON_KEY:-}
        - VITE_BIMG_API_URL=${VITE_BIMG_API_URL:-}
        - VITE_CONTAI_API_URL=${VITE_CONTAI_API_URL:-}
        - VITE_OUVIDORIA_SUPABASE_URL=${VITE_OUVIDORIA_SUPABASE_URL:-}
        - VITE_OUVIDORIA_SUPABASE_ANON_KEY=${VITE_OUVIDORIA_SUPABASE_ANON_KEY:-}
        - VITE_CARNE_LEAO_API_URL=${VITE_CARNE_LEAO_API_URL:-}
        - VITE_DOCCONTABIL_API_URL=${VITE_DOCCONTABIL_API_URL:-}
        - VITE_CNPJ_API_URL=${VITE_CNPJ_API_URL:-}
        - VITE_TASKFLOW_SUPABASE_URL=${VITE_TASKFLOW_SUPABASE_URL:-}
        - VITE_TASKFLOW_SUPABASE_ANON_KEY=${VITE_TASKFLOW_SUPABASE_ANON_KEY:-}
        - VITE_TASKFLOW_API_URL=${VITE_TASKFLOW_API_URL:-}
        - VITE_ANALYTICS_DP_API_URL=${VITE_ANALYTICS_DP_API_URL:-}
        - VITE_DASHRH_API_URL=${VITE_DASHRH_API_URL:-}
    container_name: crm-mg-frontend
    ports:
      - "${HOST_FRONTEND_PORT:-3009}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  crm_storage:
    driver: local
  pgadmin_data:
    driver: local

