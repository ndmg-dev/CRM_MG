version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-mg-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_mendonca_galvao}
      POSTGRES_USER: ${POSTGRES_USER:-crm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password_2024}
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_admin} -d ${POSTGRES_DB:-crm_mendonca_galvao}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm-mg-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mendoncagalvao.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${HOST_PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    container_name: crm-mg-backend
    environment:
      # FastAPI reads POSTGRES_ variables, and JWT/GOOGLE via .env
      POSTGRES_DB: ${POSTGRES_DB:-crm_mendonca_galvao}
      POSTGRES_USER: ${POSTGRES_USER:-crm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_password_2024}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: postgres
      BACKEND_CORS_ORIGINS: '["${SERVICE_URL_FRONTEND:-http://localhost:3000}"]'
    env_file:
      - .env
    ports:
      - "${HOST_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - crm_storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${SERVICE_URL_BACKEND:-http://localhost:8080}/api/v1
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    container_name: crm-mg-frontend
    ports:
      - "${HOST_FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  crm_storage:
    driver: local

